# =============================================================================
# Hotel Management System - CNPM2
# Docker Compose — Multi-container setup
#
# Services:
#   - frontend:   ReactJS (port 3000 dev / port 80 via nginx in prod)
#   - backend:    Flask REST API (port 5000)
#   - postgres:   PostgreSQL 15 (port 5432)
#   - mongo:      MongoDB 7 (port 27017)
#   - nginx:      Reverse proxy (port 80)
#
# Usage:
#   Development:  docker-compose up
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

# version: '3.9'  # Removed — obsolete in Docker Compose v2, causes warning

# ── Shared Network ─────────────────────────────────────────────────────────
networks:
  hotel-net:
    driver: bridge

# ── Persistent Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data:
  mongo_data:

# ── Services ──────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: hotel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoteldb}
      POSTGRES_USER: ${POSTGRES_USER:-hoteluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotelpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run schema on first start
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoteluser} -d ${POSTGRES_DB:-hoteldb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ────────────────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: hotel_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-hotel_logs}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Flask Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development      # Dùng dev stage: python run.py (Flask dev server + hot reload)
    container_name: hotel_backend
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-cnpm2-secret-dev-2024}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cnpm2-jwt-secret-dev-2024}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hoteluser}:${POSTGRES_PASSWORD:-hotelpass}@postgres:5432/${POSTGRES_DB:-hoteldb}
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-hotel_logs}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - hotel-net
    volumes:
      - ./backend:/app       # Hot reload — mọi thay đổi Python áp dụng ngay
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── ReactJS Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development    # FIX: use dev stage (npm start, port 3000) — production stage uses nginx:80 which conflicts
    container_name: hotel_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hotel-net
    volumes:
      - ./frontend/src:/app/src   # Hot reload in development

  # ── Nginx Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hotel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - hotel-net
